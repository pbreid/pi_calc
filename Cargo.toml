[package]
name = "pi"
version = "0.1.0"
edition = "2021"
description = "High-performance, verifiable, arbitrary-precision computation of pi via the Chudnovsky formula with binary splitting."
rust-version = "1.70"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rug = { version = "1", default-features = false, features = ["integer", "float", "rational"] }
rayon = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[lib]
name = "pi"
path = "src/lib.rs"

[[bin]]
name = "pi"
path = "src/main.rs"
